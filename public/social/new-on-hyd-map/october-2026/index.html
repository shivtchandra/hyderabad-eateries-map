rder-radius:50%;background:#f49a78}.place h1{max-width:890px;margin:22px 0 18px;font:700 64px/.98 Georgia,serif;letter-spacing:-2.5px;color:#102451}.status{font-size:23px;font-weight:700;color:#52617d}.rule{height:2px;background:#d8d0c2;margin:32px 0}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.info{min-height:166px;padding:24px 25px;border:2px solid #d8d0c2;border-radius:22px;background:#fffaf2}.info b{display:block;margin-bottom:13px;color:#1d4ed8;font-size:16px;letter-spacing:2px}.info span{font:700 27px/1.22 Georgia,serif;color:#132550}.practical{display:flex;justify-content:space-between;gap:20px;margin-top:28px;padding:21px 24px;border-radius:18px;background:#102451;color:#fff;font-size:20px;line-height:1.35}.practical strong{color:#78e4d4}.place-footer{position:absolute;left:66px;right:66px;bottom:38px;display:flex;justify-content:space-between;color:#102451;font-size:18px;font-weight:800}.map{background:#f5efe4;padding:58px 66px}.map .brand,.map .issue{position:static;color:#102451}.map-head{display:flex;justify-content:space-between}.map h1{margin:85px 0 12px;font:700 80px/.95 Georgia,serif;letter-spacing:-3px}.map-sub{font-size:26px;color:#53627c}.map-board{position:relative;height:580px;margin-top:46px;border-radius:34px;background:#102451;overflow:hidden}.road{position:absolute;height:3px;background:rgba(120,228,212,.24);transform-origin:left center}.r1{width:860px;left:52px;top:145px;transform:rotate(16deg)}.r2{width:740px;left:160px;top:330px;transform:rotate(-22deg)}.r3{width:620px;left:280px;top:60px;transform:rotate(67deg)}.r4{width:720px;left:90px;top:470px;transform:rotate(-8deg)}.pin{position:absolute;display:flex;align-items:center;gap:13px;color:#fff;font-size:20px;font-weight:800}.pin i{display:grid;place-items:center;width:49px;height:49px;border-radius:50% 50% 50% 0;background:#f49a78;color:#102451;font-style:normal;transform:rotate(-45deg)}.pin i span{transform:rotate(45deg)}.p1{left:480px;top:130px}.p2{left:620px;top:330px}.p3{left:210px;top:410px}.legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-top:28px}.legend div{padding:19px;border:2px solid #d8d0c2;border-radius:18px;background:#fffaf2}.legend b{display:block;margin-bottom:7px;color:#1d4ed8;font-size:15px;letter-spacing:1px}.legend span{font:700 21px/1.15 Georgia,serif}.map-cta{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding:22px 26px;border-radius:20px;background:#78e4d4;color:#102451;font-size:22px;font-weight:900}.map-note{margin-top:17px;color:#6a7385;font-size:16px}.map-footer{position:absolute;left:66px;right:66px;bottom:38px;display:flex;justify-content:space-between;color:#102451;font-size:18px;font-weight:800}

</head>
<body>
  <main id="root"></main>
  <script>
    const places=[
      {n:'01',name:'Pickle District × Madikeri',area:'Khajaguda',date:'OPENED · 02 OCT',why:'Pickleball, craft coffee and food in one stop.',best:'A game that turns into a long coffee catch-up.',cost:'Bookings via Playo or Hudle',know:'Courts + café · open play'},
      {n:'02',name:'24 Roots',area:'Gandipet · near Ocean Park',date:'ON OUR RADAR · 22 OCT',why:'An underground slow-bar café paired with pickleball.',best:'A quieter brunch, manual brews and an easy game.',cost:'Around ₹2,000 for two',know:'Verify court slots before going'},
      {n:'03',name:'Foxie Cocktail Bar',area:'Jubilee Hills',date:'ON OUR RADAR · 22 OCT',why:'A cocktail room built around the Japanese nine-tailed fox.',best:'Evening dates and groups who want conversation.',cost:'Around ₹3,500 for two',know:'Cocktails + global bar bites'}
    ];
    const q=new URLSearchParams(location.search);const s=q.get('slide')||'cover';
    const top=(page,total)=>`<div class="brand">MAPPING HYD.</div><div class="issue">HYD EAT MAP · 24 OCT</div><div class="footer"><span>@mapmyhyd</span><span>${page}/${total}</span></div>`;
    const cover=()=>`<section class="slide cover"><div class="photo"></div><div class="shade"></div>${top(1,5)}<div class="cover-copy"><span class="eyebrow">NEW THIS WEEK</span><h1>New on the<br>HYD <em>map.</em></h1><p class="dek">Three fresh places, with the details that help you decide where to go.</p></div><div class="count">3 PLACES · 3 DIFFERENT PLANS</div><div class="footer"><span>@mapmyhyd</span><span class="art-note">ILLUSTRATIVE SERIES ARTWORK · 1/5</span></div></section>`;
    const place=(p,i)=>`<section class="slide place"><div class="photo"></div><div class="shade"></div><div class="brand">MAPPING HYD.</div><div class="issue">NEW ON THE HYD MAP</div><div class="place-no">${p.n}</div><div class="place-card"><div class="meta"><span>${p.area}</span><i class="dot"></i><span>${p.date}</span></div><h1>${p.name}</h1><div class="status">A useful first look—not a paid review.</div><div class="rule"></div><div class="info-grid"><div class="info"><b>WHY GO</b><span>${p.why}</span></div><div class="info"><b>BEST FOR</b><span>${p.best}</span></div></div><div class="practical"><span><strong>PLAN FOR</strong><br>${p.cost}</span><span><strong>GOOD TO KNOW</strong><br>${p.know}</span></div></div><div class="place-footer"><span>@mapmyhyd</span><span>ILLUSTRATIVE SERIES ARTWORK · ${i+2}/5</span></div></section>`;
    const map=()=>`<section class="slide map"><div class="map-head"><div class="brand">MAPPING HYD.</div><div class="issue">SAVE THIS WEEKEND</div></div><h1>Choose by your mood.</h1><div class="map-sub">Three different plans across west Hyderabad.</div><div class="map-board"><i class="road r1"></i><i class="road r2"></i><i class="road r3"></i><i class="road r4"></i><div class="pin p1"><i><span>1</span></i>Khajaguda</div><div class="pin p2"><i><span>2</span></i>Gandipet</div><div class="pin p3"><i><span>3</span></i>Jubilee Hills</div></div><div class="legend"><div><b>PLAY + COFFEE</b><span>Pickle District</span></div><div><b>SLOW BRUNCH</b><span>24 Roots</span></div><div><b>DATE NIGHT</b><span>Foxie</span></div></div><div class="map-cta"><span>Open every pin on the live map</span><span>eats.mapmyhyd.com →</span></div><div class="map-note">Area guide only · map is not to scale. Check live hours and reservations before leaving.</div><div class="map-footer"><span>@mapmyhyd</span><span>5/5</span></div></section>`;
    document.getElementById('root').innerHTML=s==='cover'?cover():s==='map'?map():place(places[Number(s)-1],Number(s)-1);
  </script>
</body>
</html>
