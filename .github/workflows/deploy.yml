name: Batched production deploy

# Pushes to master no longer auto-deploy (vercel.json git.deploymentEnabled).
# Every production deploy rebuilds and rewrites each prerendered page and starts
# the ISR cache cold; ~10 deploys a day pushed ISR Writes, Fluid CPU and Fast
# Origin Transfer past the Hobby limits. This deploys at most twice a day, and
# only when master has moved since the last production deploy.
# Urgent deploy: Actions tab -> "Batched production deploy" -> Run workflow.
on:
  schedule:
    - cron: "15 6 * * *"   # 11:45 IST, after the 05:30 UTC offers refresh
    - cron: "15 14 * * *"  # 19:45 IST, after the 13:30 UTC offers refresh
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_63MwPWJ8SYkeVXUFoR13svdU
      VERCEL_PROJECT_ID: prj_nSHj0qzTYN9hBQ4g4vo1B6eK7XUn
    steps:
      - uses: actions/checkout@v4

      - name: Skip if production is already at this commit
        id: check
        run: |
          last=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1" \
            | jq -r '.deployments[0].meta.gitSha // .deployments[0].meta.githubCommitSha // ""')
          echo "last production sha: ${last:-none}  head: $GITHUB_SHA"
          if [ "$last" = "$GITHUB_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Production is already at HEAD; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to production
        if: steps.check.outputs.deploy == 'true'
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --meta gitSha="$GITHUB_SHA"
