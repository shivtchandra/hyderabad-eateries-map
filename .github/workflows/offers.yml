name: Dining offers (District + Swiggy Dineout)

# Dining offers refresh through the day so lunch, dinner and next-day slots stay current.
# Each run commits data/curated-offers.json, which triggers Cloudflare Pages deployment.
on:
  schedule:
    # GitHub delays scheduled runs by hours (the 07:00 IST slot kept starting near noon),
    # so fire every 3 hours on an off-peak minute. The freshness guard below skips a run
    # when the data is already under 2 hours old, so late runs never stack up.
    - cron: "17 21,0,3,6,9,12,15,18 * * *" # every 3h from 02:47 IST
  workflow_dispatch:
    inputs:
      target:
        description: "Which scraper to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - swiggy
          - district

concurrency:
  group: offers-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freshness guard
        id: fresh
        if: ${{ github.event_name == 'schedule' }}
        run: |
          age=$(node -e 'const j=require("./data/curated-offers.json");console.log(Math.round((Date.now()-Date.parse(j.updatedAt))/60000))')
          echo "Offers data is ${age} minutes old"
          if [ "$age" -lt 120 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Scrape District offers
        if: ${{ steps.fresh.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'district') }}
        run: node scripts/expand-comp-spots.mjs

      - name: Scrape Swiggy Dineout offers
        if: ${{ steps.fresh.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'swiggy') }}
        run: node scripts/fetch-swiggy-dineout.mjs

      - name: Commit and push
        id: push
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        run: |
          git config user.name  "offers-bot"
          git config user.email "actions@github.com"
          git add data/curated-offers.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(offers): refresh dining deals"
          git pull --rebase origin ${{ github.ref_name }}
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Bot pushes do not trigger other workflows, so fresh data sat in master without
      # deploying. Dispatch both deploys directly: the site, and the API worker that
      # serves /api/offers from its bundled data.
      - name: Deploy site
        if: ${{ steps.push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run static-site.yml --ref ${{ github.ref_name }}
          gh workflow run api-worker.yml --ref ${{ github.ref_name }}
