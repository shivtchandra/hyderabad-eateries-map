name: Dining offers (District + Swiggy Dineout)

# Dining offers refresh through the day so lunch, dinner and next-day slots stay current.
# Each run commits data/curated-offers.json, which triggers Cloudflare Pages deployment.
on:
  schedule:
    # GitHub delays scheduled runs by hours (the 07:00 IST slot kept starting near noon),
    # so fire every 3 hours on an off-peak minute. The freshness guard below skips a run
    # when the data is already under 2 hours old, so late runs never stack up.
    - cron: "17 21,0,3,6,9,12,15,18 * * *" # every 3h from 02:47 IST
    - cron: "15 2 * * *"          # daily verification of every known District branch
    - cron: "45 2 * * 0"          # weekly full District discovery across approved eateries
  workflow_dispatch:
    inputs:
      target:
        description: "Which scraper to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - swiggy
          - district
      district_mode:
        description: "District coverage mode"
        required: true
        default: "active"
        type: choice
        options:
          - active
          - verified
          - discover

concurrency:
  group: offers-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freshness guard
        id: fresh
        if: ${{ github.event.schedule == '17 21,0,3,6,9,12,15,18 * * *' }}
        run: |
          age=$(node -e 'const j=require("./data/curated-offers.json");console.log(Math.round((Date.now()-Date.parse(j.updatedAt))/60000))')
          echo "Offers data is ${age} minutes old"
          if [ "$age" -lt 120 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Scrape District offers
        if: ${{ steps.fresh.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'district') }}
        env:
          OFFER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.district_mode || github.event.schedule == '45 2 * * 0' && 'discover' || github.event.schedule == '15 2 * * *' && 'verified' || 'active' }}
        run: node scripts/expand-comp-spots.mjs

      - name: Scrape Swiggy Dineout offers
        if: ${{ steps.fresh.outputs.skip != 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'swiggy')) || github.event.schedule == '17 21,0,3,6,9,12,15,18 * * *') }}
        run: node scripts/fetch-swiggy-dineout.mjs

      - name: Normalize offers, update 28-day history and coverage
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        run: node scripts/update-offer-history.mjs

      - name: Commit and push
        id: push
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        run: |
          git config user.name  "offers-bot"
          git config user.email "actions@github.com"
          git add data/curated-offers.json data/offer-history.json data/offer-coverage.json
          test ! -f data/offer-unmatched.json || git add data/offer-unmatched.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(offers): refresh dining deals"
          git pull --rebase origin ${{ github.ref_name }}
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # workflow_run in static-site.yml stopped firing after this job was consolidated,
      # so fresh data sat in master without deploying. Dispatch the deploy directly.
      - name: Deploy site
        if: ${{ steps.push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run static-site.yml --ref ${{ github.ref_name }}
          gh workflow run api-worker.yml --ref ${{ github.ref_name }}
