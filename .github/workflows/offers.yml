name: Dining offers (District + Swiggy Dineout)

# Dining offers refresh through the day so lunch, dinner and next-day slots stay current.
# Each run commits data/curated-offers.json, which redeploys the site on Vercel.
#
# Both District and Swiggy Dineout run on standard GitHub Actions runners (ubuntu-latest).
on:
  schedule:
    - cron: "30 1,7,13,17 * * *" # 07:00, 13:00, 19:00 and 23:00 IST
  workflow_dispatch:
    inputs:
      target:
        description: "Which scraper to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - swiggy
          - district

concurrency:
  group: offers-data
  cancel-in-progress: false

jobs:
  district:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'district' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape District offers
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: node scripts/refresh-curated-offers.mjs
      - name: Commit
        run: |
          git config user.name  "offers-bot"
          git config user.email "actions@github.com"
          git add data/curated-offers.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(offers): District refresh"
          git pull --rebase origin ${{ github.ref_name }}
          git push

  swiggy:
    needs: [district]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'swiggy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape Swiggy Dineout offers
        run: node scripts/fetch-swiggy-dineout.mjs
      - name: Commit
        run: |
          git config user.name  "offers-bot"
          git config user.email "actions@github.com"
          git add data/curated-offers.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(offers): Swiggy Dineout refresh"
          git pull --rebase origin ${{ github.ref_name }}
          git push
