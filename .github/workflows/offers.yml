name: Dining offers (District + Swiggy Dineout)

# Slot deals change during the day ("FLAT 10% OFF from 5 PM"), so offers refresh
# every 4 hours instead of once a day. Each run commits data/curated-offers.json,
# which redeploys the site on Vercel.
#
# District runs on GitHub's own runners (plain fetch + Jina Reader, no keys).
# Swiggy Dineout picks the city from the requester's IP, so it can only run from a
# machine in Hyderabad: a self-hosted runner labelled `hyderabad`. Turn it on by
# setting the repo variable SWIGGY_RUNNER=true once that runner is registered.
on:
  schedule:
    - cron: "30 1,5,9,13 * * *" # 07:00, 11:00, 15:00, 19:00 IST
  workflow_dispatch:

concurrency:
  group: offers-data
  cancel-in-progress: false

jobs:
  district:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape District offers
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: node scripts/refresh-curated-offers.mjs
      - name: Commit
        run: |
          git config user.name  "offers-bot"
          git config user.email "actions@github.com"
          git add data/curated-offers.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(offers): District refresh"
          git pull --rebase origin master
          git push

