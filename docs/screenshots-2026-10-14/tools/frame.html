<!doctype html><html><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;background:#f8f2e4;font-family:"Space Grotesk",sans-serif;color:#16130f;position:relative}
.grain{position:absolute;inset:0;opacity:.28;mix-blend-mode:multiply;pointer-events:none}

.fold{position:absolute;left:0;right:0;top:640px;height:2px;background:linear-gradient(90deg,transparent,rgba(110,80,40,.10),transparent)}
.charminar{position:absolute;left:30px;bottom:120px;width:400px;opacity:.15}

p.sub{font-size:24px;line-height:1.35;margin-top:18px;color:#4a433c;width:390px}
.stamp{position:absolute;right:64px;top:58px;width:170px;height:170px;border-radius:50%;border:3px solid rgba(157,47,79,.55);color:rgba(157,47,79,.6);display:grid;place-items:center;text-align:center;transform:rotate(-12deg);font-weight:600;font-size:15px;letter-spacing:.12em;line-height:1.5}
.stamp:before{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px dashed rgba(157,47,79,.45)}
.stamp b{display:block;font-family:"Bricolage Grotesque";font-size:30px;letter-spacing:0}
.url{position:absolute;left:72px;bottom:48px;font-weight:600;font-size:20px;color:#6b6157;letter-spacing:.02em}
.phone{position:absolute;left:520px;top:262px;width:468px;height:984px;border-radius:72px;background:#1b1b1d;padding:14px;transform:rotate(3deg);transform-origin:top left;

.phone:before{content:"";position:absolute;inset:-3px;border-radius:75px;border:3px solid #8a8780;opacity:.55}
.screen{width:440px;height:956px;border-radius:58px;overflow:hidden;position:relative;background:#fff}
.status{height:62px;display:flex;align-items:center;justify-content:space-between;padding:8px 38px 0 46px;font-weight:600;font-size:18px}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:3}
.screen img{display:block;filter:saturate(1.12) contrast(1.04);image-rendering:high-quality;width:440px;height:894px}
.screen:after{content:"";position:absolute;inset:0;border-radius:58px;background:linear-gradient(115deg,rgba(255,255,255,.10),transparent 32%);pointer-events:none}
.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:150px;height:5px;border-radius:3px;background:#111;opacity:.85}
.tape{position:absolute;width:150px;height:44px;background:rgba(242,201,76,.62);box-shadow:0 1px 2px rgba(0,0,0,.08);z-index:5}
.t1{left:488px;top:250px;transform:rotate(-28deg)}
.t2{left:880px;top:1200px;transform:rotate(-24deg);background:rgba(224,137,158,.55)}
